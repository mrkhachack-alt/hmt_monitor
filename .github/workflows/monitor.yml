#!/usr/bin/env python3
"""HMT Watches stock monitor (headless browser). Telegram alerts with photo. State: state.json"""
import json, os, re, sys, time, urllib.parse
from datetime import datetime
from zoneinfo import ZoneInfo
import requests

ALWAYS_NOTIFY = False  # True: every run lists EVERYTHING currently in stock. False: only new / back-in-stock changes.

BASE = "https://www.hmtwatches.in"
PAGES = [("/mens", "Men's"), ("/womens", "Women's"), ("/pair", "Pair"), ("/unisex", "Unisex"),
         ("/watches", None)]
STATE = os.path.join(os.path.dirname(os.path.abspath(__file__)), "state.json")
UA = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"
NEG = re.compile(r"coming soon|out of stock|sold out|currently unavailable|notify me", re.I)
SEL = "a[href*='/product-'], a[href*='product_overview?id=']"
HEALTH = "_health"
GENDER_WORDS = {"hmt", "mens", "womens", "men", "women", "ladies", "gents", "gent", "pair", "unisex"}

CARD_JS = """() => {
  const sel = "a[href*='/product-'], a[href*='product_overview?id=']", out = [];
  const distinct = el => new Set([...el.querySelectorAll(sel)].map(x => x.href)).size;
  document.querySelectorAll(sel).forEach(a => {
    let el = a;
    while (el.parentElement && el.parentElement !== document.body && distinct(el.parentElement) <= 1) el = el.parentElement;
    const im = el.querySelector("img");
    out.push({href: a.href, text: el.innerText || "", img: im ? im.src : ""});
  });
  return out;
}"""

# ---------------------------------------------------------------- browser helpers
def settle(page, ms=4000):
    try: page.wait_for_load_state("networkidle", timeout=ms)
    except Exception: pass

def goto(page, url):
    for i in range(3):
        try:
            page.goto(url, wait_until="domcontentloaded", timeout=60000)
            settle(page)
            return True
        except Exception as e:
            print(f"load fail {url[:70]}: {str(e)[:100]}", file=sys.stderr)
            time.sleep(5 * (i + 1))
    return False

def scrape_listing(page, path):
    if not goto(page, BASE + path): return None
    if path != "/":
        for how in (lambda: page.get_by_label("Include out of Stock").check(timeout=3000),
                    lambda: page.get_by_text("Include out of Stock").first.click(timeout=3000)):
            try: how(); break
            except Exception: pass
        settle(page)
    last = -1
    for _ in range(30):
        page.mouse.wheel(0, 5000); page.wait_for_timeout(700)
        for t in ("Load More", "Load more", "Show More"):
            try:
                loc = page.get_by_text(t)
                if loc.count(): loc.first.click(timeout=1000)
            except Exception: pass
        n = page.locator(SEL).count()
        if n == last: break
        last = n
    return page.evaluate(CARD_JS)

def parse_card(c):
    lines = [l.strip() for l in c["text"].splitlines() if l.strip()]
    text = " ".join(lines)
    price = re.search(r"(?:₹|RS\.?)\s*([\d,]{3,})", text, re.I)
    name = next((l for l in lines if l.upper().startswith("HMT")), None) or \
           next((l for l in lines if re.search(r"[A-Za-z]{3}", l) and not NEG.fullmatch(l)), "")
    img = os.path.basename(urllib.parse.urlparse(c["img"]).path)
    pid = re.search(r"/product-(\d+)", c["href"])
    return {"pid": pid.group(1) if pid else None, "name": name,
            "price": "Rs. " + price.group(1) if price else "n/a",
            "neg": bool(NEG.search(text)), "img": img, "img_url": c["img"], "href": c["href"]}

def max_qty(page):
    """Click '+' on the Qty selector until it stops rising. Returns the limit, or None if no limit / not found."""
    try:
        plus = page.locator(":text-is('+'):visible").first
        inp = page.locator("input[name*='qty' i]:visible, input[name*='quantity' i]:visible, input.qty:visible, .qty input:visible").first
        read = lambda: int(re.sub(r"\D", "", inp.input_value() or "") or 0)
        last = read()
        for _ in range(12):
            plus.click(timeout=1500); page.wait_for_timeout(150)
            now = read()
            if now == last: return now
            last = now
    except Exception:
        pass
    return None

def inspect(page, url):
    if not goto(page, url): return None
    try: page.wait_for_function("/add to cart|buy now|coming soon|out of stock|sold out/i.test(document.body.innerText)", timeout=8000)
    except Exception: pass
    body = page.inner_text("body")
    main = body.split("Related Products")[0]            # ignore other watches shown lower on the page
    def field(label):
        m = re.search(r"\b%s\b\.?[\s:]*([^\n\t]+)" % re.escape(label), main)
        return m.group(1).strip() if m else None
    mrp = re.search(r"MRP\s*([\d,]+)", main)
    btns = page.locator("button:visible, a:visible").filter(has_text=re.compile(r"^\s*(add to cart|buy now)\s*$", re.I))
    can_buy = any(btns.nth(i).is_enabled() for i in range(btns.count()))
    neg = bool(NEG.search(main))
    status = "unconfirmed" if (can_buy and neg) else "in_stock" if can_buy else "unavailable" if neg else "unconfirmed"
    return {"status": status, "model": field("Model No"), "series": field("Collection"),
            "price": "Rs. " + mrp.group(1) if mrp else None,
            "qty": max_qty(page) if status == "in_stock" else None}

# ---------------------------------------------------------------- naming
def pretty(url):
    m = re.search(r"/product-\d+-([^/?#]+)", url)
    if not m: return None, None
    slug = m.group(1).lower()
    mm = re.search(r"(?:^|-)([a-z]{2,6})-(\d{1,3}[a-z]{0,2})(?=-|$)", slug)
    model = f"{mm.group(1).upper()} {mm.group(2).upper()}" if mm else None
    keep = set(model.lower().split()) if model else set()
    words = [w.upper() if w == "hmt" or w in keep else w.capitalize() for w in slug.split("-")]
    return " ".join(words), model

def series_from_slug(url):
    m = re.search(r"/product-\d+-([^/?#]+)", url)
    words = [w for w in (m.group(1).lower().split("-") if m else []) if w not in GENDER_WORDS]
    return words[0].capitalize() if words else "n/a"

def guess_category(name):
    n = name.lower()
    if re.search(r"women|ladies|lady", n): return "Women's"
    if re.search(r"\bmen|gents", n): return "Men's"
    return "Unclassified"

# ---------------------------------------------------------------- alerts
def decide(status, prev, is_new, first_run):
    if status == "in_stock":
        if prev == "in_stock": return "STILL IN STOCK" if ALWAYS_NOTIFY else None
        if is_new and not first_run: return "NEW LISTING - IN STOCK"
        return "BACK IN STOCK" if prev else "IN STOCK"
    if status == "unconfirmed" and prev not in ("unconfirmed", "in_stock"):
        return "UNCONFIRMED availability (check manually)"
    if is_new and not first_run:
        return "NEW LISTING (not purchasable yet)"
    return None

def build_item(d, cat, info, label, now):
    info = info or {}
    title, pmodel = pretty(d["href"])
    series = info.get("series") or series_from_slug(d["href"])
    model = info.get("model") or pmodel or "n/a"
    price = info.get("price") or d["price"]
    if label.endswith("IN STOCK") or label.startswith("STILL"):
        q = info.get("qty")
        stock = (f"Stock: up to {q} can be added to cart (site does not show exact stock)" if q
                 else "Stock count: not shown on the website")
        icon = "🟢"
    else:
        stock, icon = "Stock: not purchasable right now", ("🟡" if label.startswith("UNCONF") else "🆕")
    if label.startswith("NEW LISTING - IN"): icon = "🆕🟢"
    if label.startswith("BACK"): icon = "🔄🟢"
    cap = (f"{icon} {label}\n{title or d['name']}\nSeries: {series} | Model: {model}\nCategory: {cat}\n"
           f"Price: {price}\n{stock}\nDetected: {now}\n{d['href']}")
    return {"cap": cap, "img": d["img_url"], "new": not label.startswith("STILL")}

def tg(method, **kw):
    url = f"https://api.telegram.org/bot{os.environ['TELEGRAM_BOT_TOKEN']}/{method}"
    r = requests.post(url, timeout=90, **kw)
    if not r.ok: raise RuntimeError(f"{method} {r.status_code}: {r.text[:200]}")

def send_text(text):
    chat = os.environ["TELEGRAM_CHAT_ID"]
    for i in range(0, len(text), 3800):
        tg("sendMessage", data={"chat_id": chat, "text": text[i:i + 3800], "disable_web_page_preview": "true"})

def send_group(group):
    """Photos with captions. Tries image URLs, then uploading the image itself, then plain text."""
    chat = os.environ["TELEGRAM_CHAT_ID"]
    try:
        if len(group) == 1:
            tg("sendPhoto", data={"chat_id": chat, "photo": group[0]["img"], "caption": group[0]["cap"][:1000]})
        else:
            media = [{"type": "photo", "media": g["img"], "caption": g["cap"][:1000]} for g in group]
            tg("sendMediaGroup", data={"chat_id": chat, "media": json.dumps(media)})
        return
    except Exception as e:
        print("photo by URL failed:", e, file=sys.stderr)
    try:
        files, media = {}, []
        for i, g in enumerate(group):
            r = requests.get(g["img"], headers={"User-Agent": UA}, timeout=30); r.raise_for_status()
            files[f"f{i}"] = (f"f{i}.jpg", r.content)
            media.append({"type": "photo", "media": f"attach://f{i}", "caption": g["cap"][:1000]})
        if len(group) == 1:
            tg("sendPhoto", data={"chat_id": chat, "caption": group[0]["cap"][:1000]}, files={"photo": files["f0"]})
        else:
            tg("sendMediaGroup", data={"chat_id": chat, "media": json.dumps(media)}, files=files)
        return
    except Exception as e:
        print("photo upload failed:", e, file=sys.stderr)
    send_text("\n\n".join(g["cap"] for g in group))

def send_alerts(items, header):
    send_text(header)
    with_img = [i for i in items if i["img"]]
    for i in range(0, len(with_img), 10): send_group(with_img[i:i + 10])
    rest = [i["cap"] for i in items if not i["img"]]
    if rest: send_text("\n\n".join(rest))

# ---------------------------------------------------------------- main
def main():
    from playwright.sync_api import sync_playwright
    state = json.load(open(STATE)) if os.path.exists(STATE) else {}
    old = json.dumps(state, sort_keys=True)
    broken = state.get(HEALTH, {}).get("broken", False)
    state = {k: v for k, v in state.items() if k != HEALTH}
    first_run = not any(k.startswith("product-") for k in state)
    now = datetime.now(ZoneInfo("Asia/Kolkata")).strftime("%d %b %Y, %I:%M %p IST")
    cards, items, new_state = {}, [], ({} if first_run else dict(state))
    with sync_playwright() as p:
        browser = p.chromium.launch()
        ctx = browser.new_context(user_agent=UA, locale="en-IN", timezone_id="Asia/Kolkata",
                                  viewport={"width": 1366, "height": 900})
        page = ctx.new_page()
        page.route("**/*", lambda r: r.abort() if r.request.resource_type in ("image", "media", "font") else r.continue_())
        for path, cat in PAGES:
            res = scrape_listing(page, path)
            print(f"{path}: {'FAILED' if res is None else str(len(res)) + ' product links'}")
            for c in res or []:
                d = parse_card(c)
                if not d["pid"] and "product_overview" not in d["href"]: continue
                key = f"product-{d['pid']}" if d["pid"] else f"{d['name']}|{d['img']}".lower()
                if key not in cards: cards[key] = {**d, "category": cat}
                elif cat and not cards[key]["category"]: cards[key]["category"] = cat
        if not cards:
            print("NO PRODUCTS FOUND. Page title:", page.title(), "| links on page:", page.locator("a").count())
            print(page.inner_text("body")[:400])
            if not broken:
                try: send_text("HMT monitor warning: it cannot read any watches from the website right now (site down or layout changed). I will tell you when it works again.")
                except Exception as e: print("telegram fail:", e)
                json.dump({**state, HEALTH: {"broken": True}}, open(STATE, "w"), indent=1, ensure_ascii=False)
            sys.exit(1)
        n_in = 0
        for key, d in cards.items():
            cat = d["category"] or guess_category(d["name"])
            prev = state.get(key, {}).get("status")
            info = None
            if d["neg"]: status = "unavailable"
            else:
                info = inspect(page, d["href"])                  # always verified on the product page
                if info is None: continue                        # load error != stock change
                status = info["status"]
            n_in += status == "in_stock"
            label = decide(status, prev, key not in state, first_run)
            if label:
                if info is None and not label.startswith("STILL"): info = inspect(page, d["href"])
                items.append(build_item(d, cat, info, label, now))
            new_state[key] = {"name": d["name"], "status": status, "category": cat}
        browser.close()
    if items:
        items.sort(key=lambda i: not i["new"])                   # new / changed first
        changed = sum(i["new"] for i in items)
        send_alerts(items, f"HMT stock update - {now}\nIn stock now: {n_in} | New or changed: {changed}")
    if broken:
        try: send_text("HMT monitor is reading the website again.")
        except Exception as e: print("telegram fail:", e)
    if json.dumps(new_state, sort_keys=True) != old:
        json.dump(new_state, open(STATE, "w"), indent=1, ensure_ascii=False)
    print(f"{now}: {len(cards)} products checked, {n_in} in stock, {len(items)} listed in alert, first_run={first_run}")

if __name__ == "__main__":
    main()
